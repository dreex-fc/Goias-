<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz: Você conhece Goiás?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&family=Caveat+Brush&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#A8452A; --card:#FFFFFF; --title:#9C3F20; --band:#F3E3C8; --text:#D9622B;
  --accent:#F4B33D; --ok:#3F7D3A; --okbg:#E4F1DC; --no:#B3261E; --nobg:#FBE3DF; --line:#F0D9C0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#4A1F12;--card:#2B1A14;--title:#F2A27F;--band:#4A3022;--text:#F59A63;--line:#5A3C2C;--okbg:#25391F;--nobg:#4A2320;--ok:#8FD08A;--no:#FF9C93}
}
:root[data-theme="dark"]{--bg:#4A1F12;--card:#2B1A14;--title:#F2A27F;--band:#4A3022;--text:#F59A63;--line:#5A3C2C;--okbg:#25391F;--nobg:#4A2320;--ok:#8FD08A;--no:#FF9C93}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);font-family:"Fredoka","Trebuchet MS",sans-serif;color:var(--text);display:flex;justify-content:center;padding:18px 14px 28px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;top:0;left:0;width:120px;height:120px;z-index:0;opacity:.9;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.75) 0 14px,transparent 14px 28px),repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 14px,transparent 14px 28px),#C0392B;
  clip-path:polygon(0 0,100% 0,0 100%);}
.star{position:fixed;color:#5BA35A;font-size:30px;z-index:0}
.s1{top:20px;right:22px;transform:rotate(15deg)}.s2{bottom:26px;left:20px;font-size:24px;transform:rotate(-12deg)}
main{position:relative;z-index:1;width:100%;max-width:520px;background:var(--card);border-radius:34px;padding:26px 22px 28px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
h1,h2{font-family:"Chelsea Market","Fredoka",cursive;color:var(--title);text-align:center;margin:0;line-height:1.1}
h1{font-size:clamp(30px,9vw,42px)}
h2{font-size:clamp(22px,6.4vw,28px);margin:16px 0 14px}
.script{font-family:"Caveat Brush",cursive;color:var(--title);text-align:right;font-size:30px;margin:-4px 8px 10px 0}
.band{background:var(--band);color:var(--text);border-radius:16px;padding:10px 14px;text-align:center;font-weight:600;font-size:17px}
p{font-size:19px;line-height:1.45;margin:16px 0;text-align:center;font-weight:500}
.sub{color:var(--accent);font-weight:600;text-align:center;font-size:20px;margin:18px 0 4px}
button{font:inherit;cursor:pointer}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:center;background:var(--card);color:var(--text);border:3px solid var(--line);border-radius:18px;padding:14px 12px;font-size:19px;font-weight:600;min-height:54px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.go:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:16px;padding:12px 14px;background:var(--band);font-size:17px;line-height:1.4;text-align:center}
.fb b{display:block;font-size:20px;margin-bottom:4px;color:var(--title)}
.go{display:block;margin:18px auto 0;background:var(--title);color:#fff;border:0;border-radius:999px;padding:14px 30px;font-size:20px;font-weight:600}
.dark-text .go{color:#2B1A14}
.prog{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;margin-bottom:6px}
.bar{height:12px;background:var(--band);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.score{font-family:"Chelsea Market",cursive;font-size:64px;color:var(--title);text-align:center;margin:8px 0 0}
.list{margin:10px 0 0;padding:0;list-style:none;text-align:center;font-weight:500;font-size:17px;line-height:1.7}
.foot{margin-top:22px;text-align:center;font-size:15px;color:var(--text);opacity:.9}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<span class="star s1" aria-hidden="true">★</span><span class="star s2" aria-hidden="true">★</span>
<main id="app" aria-live="polite"></main>
<script>
var Q=[
{q:"Em que cidade goiana nasceu Marília Mendonça?",o:["Goiânia","Anápolis","Cristianópolis","Trindade"],a:2,t:"Ela nasceu em Cristianópolis, em 1995, e cresceu em Goiânia."},
{q:"Qual dança tradicional é muito associada ao chapéu de palha e às botas de couro?",o:["Catira","Frevo","Tango","Samba de roda"],a:0,t:"O chapéu de palha protege do sol e aparece muito na catira, ao lado da moda de viola."},
{q:"Em qual cidade acontece a Procissão do Fogaréu?",o:["Rio Verde","Cidade de Goiás","Catalão","Jataí"],a:1,t:"É na Cidade de Goiás. Os farricocos usam túnicas e capuzes e lembram os soldados que buscam Jesus."},
{q:"Onde acontece a Festa do Divino Pai Eterno, uma das maiores romarias do estado?",o:["Pirenópolis","Caldas Novas","Trindade","Formosa"],a:2,t:"Em Trindade. Os devotos costumam vestir roupas leves de algodão, chita e linho."},
{q:"Quem foi a primeira mulher a publicar poesia em Goiás?",o:["Marília Mendonça","Leodegária de Jesus","Ofélia Monteiro","Dona Ruth"],a:1,t:"Leodegária de Jesus publicou \"Corôa de Lyrios\" em 1906, aos 17 anos."},
{q:"Em que ano foi lançada a pedra fundamental de Goiânia?",o:["1891","1937","1960","1933"],a:3,t:"Foi em 24 de outubro de 1933. A capital só foi transferida em 1937."},
{q:"Qual apelido ficou famoso para Marília Mendonça?",o:["Rainha da Viola","Rainha da Sofrência","Rainha do Cerrado","Rainha do Forró"],a:1,t:"\"Rainha da Sofrência\". Ela também abriu espaço para as mulheres no sertanejo."},
{q:"Qual livro foi escrito pelo próprio Pedro Ludovico Teixeira?",o:["Como nasceu Goiânia","Orchídeas","Memórias","Coroa de Lírios"],a:2,t:"\"Memórias\" é de 1973. \"Como nasceu Goiânia\" é de Ofélia Monteiro."}
];
var app=document.getElementById("app"),i=0,score=0,answered=false;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function start(){
  i=0;score=0;
  app.innerHTML='<h1>Você conhece Goiás?</h1><div class="script">quiz goiano</div>'+
  '<div class="band">8 perguntas sobre cultura, trajes e personalidades</div>'+
  '<p>Toque na resposta que você acha certa. Depois de cada pergunta, você descobre uma curiosidade.</p>'+
  '<button class="go" id="go">Começar o quiz</button>'+
  '<div class="foot">Cultura goiana é identidade</div>';
  document.getElementById("go").onclick=show;
}
function show(){
  answered=false;var d=Q[i];
  var h='<div class="prog"><span>Pergunta '+(i+1)+' de '+Q.length+'</span><span>Acertos: '+score+'</span></div>'+
  '<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div>'+
  '<h2>'+esc(d.q)+'</h2><ul class="opts">';
  d.o.forEach(function(t,k){h+='<li><button class="opt" data-k="'+k+'">'+esc(t)+'</button></li>'});
  h+='</ul><div id="fb"></div>';
  app.innerHTML=h;
  var b=app.querySelectorAll(".opt");
  b.forEach(function(x){x.onclick=function(){pick(+x.dataset.k,b)}});
}
function pick(k,b){
  if(answered)return;answered=true;var d=Q[i],right=k===d.a;
  if(right)score++;
  b.forEach(function(x,n){x.disabled=true;if(n===d.a)x.classList.add("ok");else if(n===k)x.classList.add("no")});
  var last=i===Q.length-1;
  document.getElementById("fb").innerHTML='<div class="fb"><b>'+(right?"Acertou!":"Quase!")+'</b>'+esc(d.t)+'</div>'+
  '<button class="go" id="nx">'+(last?"Ver resultado":"Próxima pergunta")+'</button>';
  var n=document.getElementById("nx");n.focus();
  n.onclick=function(){if(last){end()}else{i++;show()}};
}
function end(){
  var m=score>=7?"Goiano de raiz!":score>=4?"Quase goiano!":"Goiás tem muito para te mostrar!";
  app.innerHTML='<h2>'+m+'</h2><div class="score">'+score+'/'+Q.length+'</div>'+
  '<div class="band">acertos no quiz</div>'+
  '<div class="sub">Quer saber mais?</div>'+
  '<ul class="list"><li>Ouça Marília Mendonça no Spotify</li><li>Leia as Memórias de Pedro Ludovico</li><li>Conheça a poesia de Leodegária de Jesus</li></ul>'+
  '<button class="go" id="re">Jogar de novo</button>'+
  '<div class="foot">Goiás é feito de gente que canta, escreve e constrói.</div>';
  document.getElementById("re").onclick=start;
}
start();
</script>
</body>
</html>
